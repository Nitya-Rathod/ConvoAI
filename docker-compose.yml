services:
  backend:
    build:
      context: ./backend

    container_name: convoai-backend

    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_URL: http://localhost:8080

    container_name: convoai-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend
